
name: Build Biplob BAR Plan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Missing Android Project Files
        run: |
          flutter create \
            --platforms=android \
            --org com.biplob.barplan \
            --project-name biplob_bar_plan \
            --overwrite .

      - name: Verify Android Gradle Files
        run: |
          ls -la android
          ls -la android/app
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biplob-BAR-Plan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
