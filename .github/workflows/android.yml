name: Build Biplob BAR Plan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify App Source
        run: |
          echo "Checking Flutter application source..."
          test -f lib/main.dart
          grep -n "BarPrepApp" lib/main.dart
          echo "Source file found."

      - name: Generate Android Platform Files
        run: |
          flutter create \
            --platforms=android \
            --org com.biplob.barplan \
            --project-name biplob_bar_plan \
            --no-pub /tmp/biplob_bar_plan

          rm -rf android
          cp -R /tmp/biplob_bar_plan/android ./android

      - name: Verify Android Gradle Files
        run: |
          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts
          echo "Android Gradle files found."

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Biplob-BAR-Plan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
